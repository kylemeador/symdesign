version: 1
formatters:
  standard:
    class: logging.Formatter
    format: '\033[38;5;93m{name}\033[0;0m-\033[38;5;208m{levelname}\033[0;0m: {message}'
    style: '{'  # Todo copy features down the config
  file_standard:
    class: logging.Formatter
    format: '{name}-{levelname}: {message}'
  none:
    class: logging.Formatter
    format: '{message}'
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: sys.stdout
  main_file:
    class: logging.FileHandler
    level: DEBUG
    mode: a
    formatter: file_standard
    filename: SYMDESIGN.log
  null:
    class: logging.NullHandler
loggers:
  symdesign:
    level: INFO
    handlers: [console]
    propagate: no
  orient:
    level: INFO
    handlers: [console]
    propagate: no
  null:
    level: WARNING
    handlers: [null]
    propagate: no
root:
  level: WARNING
  handlers: [console]
